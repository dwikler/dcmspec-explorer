repos:
  - repo: local
    hooks:
      - id: compile-ui
        name: Compile Qt .ui files before commit
        entry: poetry run compile-ui
        language: system
        types: [python]
        files: \.ui$

      # Run the linter and formatter using poetry's own venv (see pyproject.toml's
      # ruff/mypy dev dependencies) instead of pre-commit's isolated hook envs, so the
      # versions used here always match `poetry run ruff`/`poetry run mypy` exactly and
      # mypy has real access to the project's actual installed type stubs (PySide6, bs4,
      # dcmspec) rather than running blind. --force-exclude makes ruff still honor
      # pyproject.toml's [tool.ruff] exclude (generated *_ui.py files) even though
      # pre-commit passes explicit filenames, which ruff otherwise treats as
      # forced-inclusion regardless of exclude.
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix --force-exclude --line-length=120
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --force-exclude --line-length=120
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: poetry run mypy --ignore-missing-imports .
        language: system
        types: [python]
        pass_filenames: false
