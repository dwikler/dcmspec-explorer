name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Poetry
        uses: pronovic/setup-poetry@v3
        with:
          version: "2.1.1"
          cache-venv: "true"
          cache-poetry: "true"

      - name: Install dependencies
        run: poetry install --with dev

      # ubuntu-latest's base image ships none of the shared libraries PySide6 dynamically
      # links against, even under QT_QPA_PLATFORM=offscreen (which only skips needing a real
      # X server, not these libraries). Verified against a real ubuntu:24.04 (amd64) container:
      # constructing a QApplication + QMainWindow/.show()/QMenu/QDialog (as the wiring tests do)
      # needs all of these to import and run without an ImportError.
      - name: Install Qt runtime dependencies (Linux, for offscreen tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libx11-xcb1 libxrender1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libsm6 libice6 libglib2.0-0t64

      # Runs the same checks as the local pre-commit hooks, so CI still catches lint/type
      # issues even if a contributor commits with --no-verify.
      - name: Run ruff check
        run: poetry run ruff check --line-length=120 .

      - name: Run ruff format check
        run: poetry run ruff format --check --line-length=120 .

      - name: Run mypy
        run: poetry run mypy --ignore-missing-imports .

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -v tests/unit tests/integration
